; TYPEE – tối ưu PHP cho môi trường Docker local.
; wp-content gắn từ ổ Windows nên mỗi lần PHP kiểm tra file (stat/realpath) rất chậm.
; Ảnh wordpress:latest mặc định chỉ cho OPcache giữ 4.000 file và kiểm tra lại file mỗi 2 giây;
; một trang WooCommerce đã nạp ~2.900 file nên cache liên tục bị đẩy ra.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
; Sửa code PHP có hiệu lực sau tối đa 10 giây.
opcache.revalidate_freq=10
realpath_cache_size=4096K
realpath_cache_ttl=600
